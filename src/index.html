<!DOCTYPE html>

<html lang="lv">
  <head>
    <meta charset="UTF-8">
    <title>tudu</title>
		<script type="module" src="./js/main.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <nav>
      <h2 id="home-navigator">Sākums</h2>
      <h2 id="projects-navigator">Projekti</h2>
    </nav>

    <main id="app"></main>

    <!-- HOME SCREN -->
    <template id="home">
      <section>
        <h3>urgent</h3>
        <ul id="urgent-list"></ul>
      </section>
      
      <section>
        <h3>newest changes</h3>
        <ul id="recently-modified-list"></ul>
      </section>
    </template>

    <!-- PROJECTS LIST -->
    <template id="projects">
      <h1>Projekti</h1>
      <input id="project-title-input" placeholder="ievadi projekta nosaukumu">
      <button id="create-project">Izveidot projektu</button>
      <ul id="project-list"></ul>
    </template>

    <!-- TASK LIST -->
    <template id="tasks">
      <h1></h1>

      <form id="task-form">
        <input name="title" placeholder="ievadi uzdevumu">
        <input name="desc" placeholder="ievadi aprakstu">
        <input name="dueDate" type="datetime-local">

        <label for="priority-select">izvēlies prioritāti:</label>
        <select name="priority" id="priority-select">
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
        <button id="create-task-button">Pievienot uzdevumu</button>
      </form>

      <button id="filter-active" onclick="setFilter('active')">Nepabeigtie</button>
      <button id="filter-done" onclick="setFilter('done')">Pabeigtie</button>
      <button id="filter-all" onclick="setFilter('all')">Visi</button>
      <ul id="task-list"></ul>
    </template>

    <!-- an individual task -->
    <template id="task">
      <input class="task-title">
      <input class="task-desc">
      <p>termiņš:    <input class="task-due-date" type="datetime-local"></p>
      <p>prioritāte: <input class="task-priority"></p>
      <p class='status'>statuss: </p>
      <button class="delete-button">dzēst</button>
    </template>
  </body>
</html>
