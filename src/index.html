<!DOCTYPE html>

<html lang="lv">
  <head>
    <meta charset="UTF-8">
    <title>Registresanas</title>
    <script src="./js/auth.js" defer></script>
    <link rel="stylesheet" href="./css/index.css">
  </head>

  <body>
    <h1>čau, laiks verificēties sistēmā</h1>


    <div id="auth">

      <section >
        <h2>reģistrēšanās</h2>

        <form id="register-form">
          <label>
            lietotājvārds: 
            <input id="username" name="username" type="text"required>
          </label>
          
          <label>
            e-pasts:
            <input id="email" name="email" type="email" required>
          </label>

          <label>
            parole:
            <input id="password" name="password" type="password" required>
          </label>
          <button>nosutit uz galvenā pakalpojuma sniedzēju</button>
        </form>
      </section>


      <section>
        <h2>ielogošanās</h2>

        <form id="login-form">
          <label>
            e-pasts:
            <input id="email" name="email" type="email" required>
          </label>
          
          <label>
            parole:
            <input id="password" name="password" type="password" required>
          </label>
          <button>nosutit uz galvenā pakalpojuma sniedzēju</button>
        </form>

      </section>
      
    </div>
    <p id="message">Šeit tiks attēlots pieslēgšanās statuss</p>
  </body>
</html>
