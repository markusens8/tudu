<!DOCTYPE html>

<html lang="lv">
  <head>
    <meta charset="UTF-8">
    <title>tudu</title>

    <script src="./scripts/script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <nav>
      <h2 onClick="navigate('home')">Sākums</h2>
      <h2 onClick="navigate('projects')">Projekti</h2>
      <button onclick="localStorage.clear()">delete data</button>
    </nav>
    <main id="app"></main>

    <!-- HOME SCREN -->
    <template id="home">
      <section>
        <h3>urgent</h3>
        <ul id="urgent-list"></ul>
      </section>
      
      <section>
        <h3>newest changes</h3>
        <ul id="modified-list"></ul>
      </section>
    </template>

    <!-- PROJECTS LIST -->
    <template id="projects">
      <h1>Projekti</h1>
      <input id="title" placeholder="ievadi projekta nosaukumu">
      <button onclick="createProject()">Izveidot projektu</button>
      <ul></ul>
    </template>

    <!-- TASK LIST -->
    <template id="tasks">
      <h1></h1>

      <form id="task-form" onsubmit="createTask(Object.fromEntries(new FormData(this))); return false;">
        <input name="title" placeholder="ievadi uzdevumu">
        <input name="desc" placeholder="ievadi aprakstu">
        <input name="dueDate" type="datetime-local">

        <label for="priority-select">izvēlies prioritāti:</label>
        <select name="priority" id="priority-select">
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
        <button id="create-task-button">Pievienot uzdevumu</button>
      </form>

      <button id="filter-active" onclick="setFilter('active')">Nepabeigtie</button>
      <button id="filter-done" onclick="setFilter('done')">Pabeigtie</button>
      <button id="filter-all" onclick="setFilter('all')">Visi</button>
      <ul id="task-list"></ul>
    </template>
  </body>
</html>
